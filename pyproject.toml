[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docs101"
version = "0.1.0"
description = "Python client for the docs101 invoicing API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "docs101", email = "info@docs101.com" },
]
keywords = ["invoicing", "api", "zugferd", "datev", "e-invoice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["requests>=2.20.0"]

[project.urls]
Homepage = "https://docs101.com"
Documentation = "https://docs101.com/help/developers/"
Repository = "https://github.com/docs101/docs101-python"
Issues = "https://github.com/docs101/docs101-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/docs101"]
